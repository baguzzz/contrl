name: Build Windows Controller Mapper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Test core
        run: cargo test -p mapper-core

  build-windows:
    needs: test-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build Windows release
        run: cargo build --release --target x86_64-pc-windows-msvc -p mapper-app

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: input-mapper-windows
          path: target/x86_64-pc-windows-msvc/release/mapper-app.exe